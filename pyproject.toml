[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snacky_dash"
version = "0.1.0"
description = "A solver for a Snacky Dash game"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}